<div id="snake-game">

<style>

    margin: 20px 0 8px;
    text-align: center;
  }

    display: flex;
    justify-content: center;

  }

  .snake-hud b {
    color: var(--text-color);
    font-size: 16px;
  }

  #snake-canvas {
    display: block;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 8px;
    background: var(--content-bg-color);
    box-shadow: 0 0 0 1px var(--btn-default-border-color), 0 2px 12px rgba(0, 0, 0, .08);
    touch-action: none;
  }

  }

  }

  /* 触屏设备或窄屏上才显示方向键 */

      display: grid;

  }

    margin: 12px 0 4px;

</style>

<script>
  (function () {
    'use strict';

    var canvas = document.getElementById('snake-canvas');
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('snake-score');
    var bestEl = document.getElementById('snake-best');

    var COLS = 20;
    var ROWS = 20;
    var BASE_STEP = 150;   // 初始每步毫秒数
    var MIN_STEP = 60;     // 最快每步毫秒数
    var BEST_KEY = 'harry-blog-snake-best';

    var snake, dir, queued, food, score, state, cell, stepMs, acc, lastTs;
    var best = loadBest();

    bestEl.textContent = best;

    // 全局的「手气不错」悬浮按钮会压住游戏画面，这一页收起来，底部给了等价入口
    // 注意：这个按钮由 body-end 注入，比本段脚本更晚解析，所以要等 DOM 就绪再找
    var hideLuckyButton = function () {
      var luckyBtn = document.querySelector('.lucky-btn');
      if (luckyBtn) luckyBtn.style.display = 'none';
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', hideLuckyButton);
    } else {
      hideLuckyButton();
    }

    // ---------- 配色：跟随站点主题（暗色走 prefers-color-scheme） ----------
    var colors = {};

    function cssVar(name, fallback) {
      var value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return value || fallback;
    }

    function readColors() {
      // 用 --text-color 而非 --theme-color：后者在暗色模式下仍是 #222，会糊进背景
      colors.ink = cssVar('--text-color', '#333');
      colors.bg = cssVar('--content-bg-color', '#fff');
      colors.dim = cssVar('--blockquote-color', '#999');
      colors.food = '#ff6b6b';
    }

    readColors();

    var schemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
    if (schemeQuery.addEventListener) {
      schemeQuery.addEventListener('change', readColors);
    } else if (schemeQuery.addListener) {
      schemeQuery.addListener(readColors);
    }

    // ---------- 最高分存档 ----------
    function loadBest() {
      try {
        return parseInt(window.localStorage.getItem(BEST_KEY), 10) || 0;
      } catch (e) {
        return 0;   // 隐私模式禁用存储时不至于让整个游戏挂掉
      }
    }

    function saveBest(value) {
      try {
        window.localStorage.setItem(BEST_KEY, String(value));
      } catch (e) {
        // 存不进去就算了，不影响本局游戏
      }
    }

    // ---------- 尺寸 ----------
    function fit() {
      var dpr = window.devicePixelRatio || 1;
      var size = canvas.clientWidth || 400;

      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell = size / COLS;
    }

    // ---------- 游戏状态 ----------
    function reset() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      queued = null;
      score = 0;
      stepMs = BASE_STEP;
      acc = 0;
      lastTs = 0;
      scoreEl.textContent = '0';
      placeFood();
      state = 'ready';
    }

    function placeFood() {
      var free = [];
      for (var x = 0; x < COLS; x++) {
        for (var y = 0; y < ROWS; y++) {
          if (!snake.some(function (seg) { return seg.x === x && seg.y === y; })) {
            free.push({ x: x, y: y });
          }
        }
      }
      // 格子被占满时没有可放的位置，游戏实际已经赢了
      food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    function gameOver() {
      state = 'over';
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        saveBest(best);
      }
    }

    function step() {
      if (queued) {
        dir = queued;
        queued = null;
      }

      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
        return gameOver();
      }

      // 撞自己：尾巴这一格本回合会移走，所以最后一节不算障碍
      for (var i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      if (food && head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        stepMs = Math.max(MIN_STEP, BASE_STEP - Math.floor(score / 5) * 10);
        placeFood();
      } else {
        snake.pop();
      }
    }

    // ---------- 绘制 ----------
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function stateText() {
      if (state === 'ready') return ['按方向键开始', '手机可以滑动屏幕'];
      if (state === 'paused') return ['已暂停', '按空格继续'];
      if (state === 'over') return ['游戏结束 · 得分 ' + score, '按方向键再来一局'];
      return ['', ''];
    }

    function draw() {
      var size = COLS * cell;

      ctx.clearRect(0, 0, size, size);

      // 网格
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = colors.ink;
      ctx.lineWidth = 1;
      for (var i = 1; i < COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0);
        ctx.lineTo(i * cell, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cell);
        ctx.lineTo(size, i * cell);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // 食物
      if (food) {
        ctx.fillStyle = colors.food;
        ctx.beginPath();
        ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.32, 0, Math.PI * 2);
        ctx.fill();
      }

      // 蛇（蛇头不透明，身体略淡）
      for (var j = snake.length - 1; j >= 0; j--) {
        var seg = snake[j];
        var pad = cell * 0.08;
        ctx.fillStyle = colors.ink;
        ctx.globalAlpha = j === 0 ? 1 : 0.72;
        roundRect(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.22);
      }
      ctx.globalAlpha = 1;

      // 状态提示放在底部，避免盖住中央的蛇
      if (state !== 'running') {
        var lines = stateText();
        var bandHeight = cell * 3.2;
        var bandTop = size - bandHeight - cell * 0.4;

        ctx.fillStyle = colors.bg;
        ctx.globalAlpha = 0.86;
        ctx.fillRect(0, bandTop, size, bandHeight);
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = colors.ink;
        ctx.font = 'bold ' + Math.max(14, cell * 0.8) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillText(lines[0], size / 2, bandTop + bandHeight * 0.38);

        if (lines[1]) {
          ctx.fillStyle = colors.dim;
          ctx.font = Math.max(12, cell * 0.62) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillText(lines[1], size / 2, bandTop + bandHeight * 0.72);
        }
      }
    }

    // ---------- 主循环 ----------
    function loop(timestamp) {
      window.requestAnimationFrame(loop);

      var dt = lastTs ? Math.min(timestamp - lastTs, 100) : 0;
      lastTs = timestamp;

      if (state === 'running') {
        acc += dt;
        var guard = 0;
        while (acc >= stepMs && state === 'running' && guard++ < 5) {
          acc -= stepMs;
          step();
        }
      }

      draw();
    }

    // ---------- 操作 ----------
    function turn(nx, ny) {
      if (state === 'ready' || state === 'over') {
        reset();
        state = 'running';
      }
      if (state !== 'running') return;
      if (nx === -dir.x && ny === -dir.y) return;   // 不允许原地掉头
      if (nx === dir.x && ny === dir.y) return;
      queued = { x: nx, y: ny };
    }

    function togglePause() {
      if (state === 'running') {
        state = 'paused';
      } else if (state === 'paused') {
        state = 'running';
      }
    }

    var KEYS = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };

    document.addEventListener('keydown', function (event) {
      var target = event.target;
      var tag = (target && target.tagName || '').toLowerCase();
      // 别抢搜索框、评论框这些输入区域的按键
      if (tag === 'input' || tag === 'textarea' || (target && target.isContentEditable)) return;

      var key = (event.key || '').toLowerCase();

      if (key === ' ' || key === 'spacebar') {
        if (state === 'running' || state === 'paused') {
          event.preventDefault();
          togglePause();
        }
        return;
      }

      var delta = KEYS[key];
      if (!delta) return;

      event.preventDefault();   // 防止方向键把页面滚走
      turn(delta[0], delta[1]);
    });

    var DPad = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    Array.prototype.forEach.call(document.querySelectorAll('.snake-key'), function (button) {
      button.addEventListener('click', function (event) {
        var delta = DPad[button.getAttribute('data-dir')];
        if (!delta) return;
        event.preventDefault();
        turn(delta[0], delta[1]);
      });
    });

    // 触屏滑动
    var swipeStart = null;

    canvas.addEventListener('touchstart', function (event) {
      var touch = event.changedTouches[0];
      swipeStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    canvas.addEventListener('touchend', function (event) {
      if (!swipeStart) return;

      var touch = event.changedTouches[0];
      var dx = touch.clientX - swipeStart.x;
      var dy = touch.clientY - swipeStart.y;
      swipeStart = null;

      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
        // 轻点：没开始时开局，进行中则暂停
        if (state === 'ready' || state === 'over') {
          turn(1, 0);
        } else {
          togglePause();
        }
        return;
      }

      if (Math.abs(dx) > Math.abs(dy)) {
        turn(dx > 0 ? 1 : -1, 0);
      } else {
        turn(0, dy > 0 ? 1 : -1);
      }
    }, { passive: true });

    // 切到别的标签页时自动暂停，免得回来发现已经撞死了
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && state === 'running') {
        state = 'paused';
      }
    });

    window.addEventListener('resize', function () {
      fit();
    });

    // ---------- 随便逛一篇 ----------
    var randomLink = document.getElementById('snake-random');
    if (randomLink) {
      var postPool = null;

      var jumpToRandom = function (posts) {
        var candidates = posts.filter(function (post) {
          return '/' + post.path !== window.location.pathname;
        });
        if (!candidates.length) candidates = posts;
        var target = candidates[Math.floor(Math.random() * candidates.length)];
        window.location.href = '/' + target.path;
      };

      randomLink.addEventListener('click', function (event) {
        event.preventDefault();
        if (postPool) {
          jumpToRandom(postPool);
          return;
        }
        fetch('/content.json')
          .then(function (res) { return res.json(); })
          .then(function (posts) {
            postPool = posts;
            jumpToRandom(posts);
          })
          .catch(function () {
            window.location.href = '/';   // 取不到文章列表就退回首屏
          });
      });
    }

    // ---------- 启动 ----------
    fit();
    reset();
    window.requestAnimationFrame(loop);
  })();
</script>

    cursor: pointer;
    opacity: .75;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
    transition: opacity .2s ease, transform .2s ease;
    user-select: none;
  }

  .lucky-btn:hover {
    opacity: 1;
    transform: translateY(-2px);
  }

  .lucky-btn.is-loading {
    opacity: 1;
  }

  .lucky-btn.is-loading .lucky-icon {
    animation: lucky-spin .8s linear infinite;
  }

  @keyframes lucky-spin {
    to { transform: rotate(360deg); }
  }

  /* 窄屏：只留图标，避免和回顶按钮挤在一起 */
  @media (max-width: 767px) {
    .lucky-btn {

<button class="lucky-btn" id="lucky-btn" type="button" title="随便看一篇" aria-label="手气不错">
  <i class="fa fa-random lucky-icon" aria-hidden="true"></i>
  <span class="lucky-text">手气不错</span>
</button>

<script>
  (function () {
    var btn = document.getElementById('lucky-btn');
    if (!btn || !window.fetch) return;

    var pool = null;

    function pick(list) {
      var here = window.location.pathname;
      var candidates = list.filter(function (post) {
        return '/' + post.path !== here;
      });
      if (!candidates.length) candidates = list;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    btn.addEventListener('click', function () {
      btn.classList.add('is-loading');

      // 已经取过一次就复用，避免反复请求
      if (pool) {
        window.location.href = '/' + pick(pool).path;
        return;
      }

      fetch('/content.json')
        .then(function (res) { return res.json(); })
        .then(function (posts) {
          if (!posts || !posts.length) throw new Error('empty');
          pool = posts;
          window.location.href = '/' + pick(pool).path;
        })
        .catch(function () {
          // 拿不到文章列表就安静地退化：藏起来，不给用户看报错
          btn.classList.remove('is-loading');
          btn.style.display = 'none';
        });
    });
  })();
</script>
