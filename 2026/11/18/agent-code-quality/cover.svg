<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">一个月 11000 个 PR，回滚率 0.5%</title>
  <desc id="coverDesc">SpaceX AI 工程师 Lauren Tan 的演讲题图，核心数字是一个月 11000 个 pull request，回滚率 0.5%。</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .blue { fill: #2a78d6; }
    .aqua { fill: #1baf7a; }
    .orange { fill: #eb6834; }
    .hair { fill: none; stroke: #c3c2b7; stroke-width: 1; }
  </style>

  <rect width="1200" height="630" fill="#fcfcfb"/>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e1e0d9" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>

  <text class="sans muted" x="72" y="98" font-size="18" letter-spacing="3">SPACEX AI · GROK BOT</text>

  <text class="sans blue" x="64" y="300" font-size="190" font-weight="700" letter-spacing="-8">11,000</text>
  <text class="sans ink2" x="72" y="356" font-size="30">pull requests in one month</text>
  <line x1="72" y1="392" x2="620" y2="392" stroke="#2a78d6" stroke-width="2"/>

  <text class="sans ink" x="72" y="486" font-size="64" font-weight="700">0.5%</text>
  <rect class="aqua" x="226" y="462" width="10" height="10" rx="2"/>
  <text class="sans muted" x="248" y="473" font-size="20">revert rate</text>

  <text class="sans ink" x="72" y="570" font-size="32" font-weight="600">All Code Is Slop</text>
  <text class="sans muted" x="72" y="610" font-size="24">(Except Mine)</text>
  <text class="sans muted" x="1128" y="610" font-size="18" text-anchor="end">Lauren Tan · poteto</text>

  <g transform="translate(790,160)">
    <rect class="blue" x="0" y="0" width="60" height="60" rx="8"/>
    <rect class="hair" x="78" y="0" width="60" height="60" rx="8"/>
    <rect class="blue" x="156" y="0" width="60" height="60" rx="8"/>
    <rect class="aqua" x="234" y="0" width="60" height="60" rx="8"/>

    <rect class="blue" x="0" y="78" width="60" height="60" rx="8"/>
    <rect class="blue" x="78" y="78" width="60" height="60" rx="8"/>
    <rect class="aqua" x="156" y="78" width="60" height="60" rx="8"/>
    <rect class="hair" x="234" y="78" width="60" height="60" rx="8"/>

    <rect class="blue" x="0" y="156" width="60" height="60" rx="8"/>
    <rect class="hair" x="78" y="156" width="60" height="60" rx="8"/>
    <rect class="blue" x="156" y="156" width="60" height="60" rx="8"/>
    <rect class="blue" x="234" y="156" width="60" height="60" rx="8"/>

    <rect class="aqua" x="0" y="234" width="60" height="60" rx="8"/>
    <rect class="blue" x="78" y="234" width="60" height="60" rx="8"/>
    <rect class="orange" x="156" y="234" width="60" height="60" rx="8"/>
    <rect class="blue" x="234" y="234" width="60" height="60" rx="8"/>
  </g>
  <text class="sans muted" x="790" y="500" font-size="18">code is the input</text>
</svg>
