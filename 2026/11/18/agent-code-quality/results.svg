<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="statsTitle statsDesc">
  <title id="statsTitle">一个月之后的数字</title>
  <desc id="statsDesc">团队一个月提交 11000 个 PR，回滚率 0.5%，227 人至少提交过一个 PR，稳定版大约一天一个。</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .muted { fill: #898781; }
    .blue { fill: #2a78d6; }
    .aqua { fill: #1baf7a; }
    .orange { fill: #eb6834; }
    .tile { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1; }
  </style>

  <rect width="1200" height="520" fill="#fcfcfb"/>
  <text class="sans ink" x="72" y="80" font-size="34" font-weight="700">一个月之后</text>
  <text class="sans muted" x="72" y="116" font-size="18">数字来自 Lauren Tan 在演讲里的分享</text>

  <rect class="tile" x="72" y="180" width="240" height="220" rx="16"/>
  <text class="sans muted" x="96" y="222" font-size="15">PR 进生产</text>
  <text class="sans ink" x="96" y="300" font-size="56" font-weight="700">11,000</text>
  <rect class="blue" x="96" y="330" width="10" height="10" rx="2"/>
  <text class="sans ink2" x="120" y="340" font-size="15">一个月</text>
  <line x1="96" y1="380" x2="288" y2="380" stroke="#2a78d6" stroke-width="2"/>

  <rect class="tile" x="348" y="180" width="240" height="220" rx="16"/>
  <text class="sans muted" x="372" y="222" font-size="15">回滚率</text>
  <text class="sans ink" x="372" y="300" font-size="56" font-weight="700">0.5%</text>
  <rect class="aqua" x="372" y="330" width="10" height="10" rx="2"/>
  <text class="sans ink2" x="396" y="340" font-size="15">还在往下走</text>
  <line x1="372" y1="380" x2="564" y2="380" stroke="#1baf7a" stroke-width="2"/>

  <rect class="tile" x="624" y="180" width="240" height="220" rx="16"/>
  <text class="sans muted" x="648" y="222" font-size="15">贡献者</text>
  <text class="sans ink" x="648" y="300" font-size="56" font-weight="700">227</text>
  <rect class="blue" x="648" y="330" width="10" height="10" rx="2"/>
  <text class="sans ink2" x="672" y="340" font-size="15">至少一个 PR</text>
  <line x1="648" y1="380" x2="840" y2="380" stroke="#2a78d6" stroke-width="2"/>

  <rect class="tile" x="900" y="180" width="240" height="220" rx="16"/>
  <text class="sans muted" x="924" y="222" font-size="15">稳定版</text>
  <text class="sans ink" x="924" y="300" font-size="56" font-weight="700">~1 / 天</text>
  <rect class="orange" x="924" y="330" width="10" height="10" rx="2"/>
  <text class="sans ink2" x="948" y="340" font-size="15">大约一天一个</text>
  <line x1="924" y1="380" x2="1116" y2="380" stroke="#eb6834" stroke-width="2"/>

  <text class="sans ink2" x="72" y="470" font-size="18">高产量没有带来高回滚，这是演讲里最反直觉的部分</text>
</svg>
